openapi: 3.0.3
info:
  title: Scepter Media CDN API
  version: 1.1.0
  description: |
    Media API backed by Cloudflare Images and Cloudflare Stream.
    Images use server-side CRUD. Videos use Cloudflare Stream direct creator uploads so
    clients upload video bytes directly to Cloudflare without receiving the API token.
servers:
  - url: http://localhost:5000
    description: Local development
security:
  - ApiKeyAuth: []
paths:
  /health:
    get:
      summary: Health check
      security: []
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/images:
    post:
      summary: Upload a new image
      description: |
        multipart/form-data with required fields `file` and `path`.
        The path is the exact Cloudflare Images custom ID, including nested paths
        and extensions, for example huziibee/001.jpg. Assets persist until explicitly deleted.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, path]
              properties:
                file:
                  type: string
                  format: binary
                path:
                  type: string
                  example: huziibee/001.jpg
      responses:
        "201":
          description: Image created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"

  /api/images/{path}:
    parameters:
      - $ref: "#/components/parameters/ImagePath"
    get:
      summary: Get image metadata
      responses:
        "200":
          description: Image found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    put:
      summary: Replace image bytes at an existing path
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Image replaced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
    delete:
      summary: Delete an image
      responses:
        "204":
          description: Deleted
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"

  /api/videos/direct-upload:
    post:
      summary: Create a one-time Cloudflare Stream upload URL
      description: |
        The backend authenticates to Cloudflare and returns a one-time upload URL.
        The client then POSTs the video file directly to that URL.
        Basic direct uploads are intended for videos up to 200 MB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVideoUploadRequest"
      responses:
        "201":
          description: One-time upload URL created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectVideoUploadResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"

  /api/videos/{uid}:
    parameters:
      - $ref: "#/components/parameters/VideoUid"
    get:
      summary: Get video processing state and playback URLs
      responses:
        "200":
          description: Video found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
    delete:
      summary: Delete a video
      responses:
        "204":
          description: Deleted
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Required when SERVICE_API_KEY is configured.

  parameters:
    ImagePath:
      name: path
      in: path
      required: true
      description: Nested custom image ID/path.
      schema:
        type: string
      example: huziibee/001.jpg
    VideoUid:
      name: uid
      in: path
      required: true
      schema:
        type: string
      example: f65014bc6ff5419ea86e7972a047ba22

  schemas:
    ImageResponse:
      type: object
      required: [id, url]
      properties:
        id:
          type: string
        url:
          type: string
          format: uri
        filename:
          type: string
          nullable: true
        contentType:
          type: string
          nullable: true
        uploaded:
          type: string
          format: date-time
          nullable: true

    CreateVideoUploadRequest:
      type: object
      properties:
        maxDurationSeconds:
          type: integer
          minimum: 1
          maximum: 36000
          default: 600
        creator:
          type: string
          maxLength: 64
          nullable: true
        fileName:
          type: string
          description: Stored as Stream meta.name; does not set the Cloudflare-generated video UID.
          example: huziibee/001.mp4
          nullable: true
        allowedOrigins:
          type: array
          items:
            type: string
          nullable: true
        requireSignedUrls:
          type: boolean
          default: false

    DirectVideoUploadResponse:
      type: object
      required: [uid, uploadUrl]
      properties:
        uid:
          type: string
        uploadUrl:
          type: string
          format: uri

    VideoResponse:
      type: object
      required: [uid, readyToStream, requireSignedUrls]
      properties:
        uid:
          type: string
        readyToStream:
          type: boolean
          description: Poll GET /api/videos/{uid} until true before using playback URLs.
        preview:
          type: string
          nullable: true
        thumbnail:
          type: string
          nullable: true
        playback:
          $ref: "#/components/schemas/VideoPlaybackResponse"
        status:
          $ref: "#/components/schemas/VideoStatusResponse"
        duration:
          type: number
          format: double
          nullable: true
        size:
          type: integer
          format: int64
          nullable: true
        uploaded:
          type: string
          format: date-time
          nullable: true
        creator:
          type: string
          nullable: true
        requireSignedUrls:
          type: boolean

    VideoPlaybackResponse:
      type: object
      nullable: true
      properties:
        hls:
          type: string
          nullable: true
        dash:
          type: string
          nullable: true

    VideoStatusResponse:
      type: object
      nullable: true
      properties:
        state:
          type: string
          nullable: true
        pctComplete:
          type: string
          nullable: true
        errorReasonCode:
          type: string
          nullable: true
        errorReasonText:
          type: string
          nullable: true

    HealthResponse:
      type: object
      required: [status, provider]
      properties:
        status:
          type: string
          example: ok
        provider:
          type: string
          enum: [Local, Cloudflare]

    ProblemDetails:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        traceId:
          type: string

  responses:
    Problem:
      description: RFC 7807 problem details
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
        application/json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
